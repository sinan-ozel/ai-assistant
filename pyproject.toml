[project]
name = "ai-assistant"
version = "0.1.0"
description = "A container-based agent framework"
readme = "README.md"
authors = [
    { name = "Sinan Ozel", email = "coding@sinan.slmail.me" },
]
license = { file = "LICENSE" }
dependencies = [
    "pytest==9.0.1",
    "pytest-depends==1.0.1",
    "pytest-repeated==0.3.9",
    "pillow==12.0.0",
    "pillow-heif==1.1.1",
    "redis-memory==0.4.2",
    "synced-memory==0.1.3",
    "qdrant-client==1.12.1",
    "streamlit==1.52.1",
    "litellm==1.84.0",
    "fastapi==0.124.2",
    "uvicorn[standard]==0.38.0",
    "supervisor==4.3.0",
    "jsonschema==4.23.0",
    "tiktoken>=0.12.0",
    "pyyaml>=6.0.0",
    "pymupdf-layout==1.27.1",
    "pymupdf4llm==0.3.4",
    "lancedb>=0.6.0",
    "fastembed==0.8.0",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent"
]

[project.optional-dependencies]
test = [
    "pytest==9.0.1",          # For running tests
    "pytest-cov>=3.0.0",      # For test coverage reporting
    "pytest-depends>=1.0.1",  # For test dependency management
    "pytest-mock>=3.14.0",    # For mocking in tests
    "pytest-openapi==0.3.1",  # For OpenAPI contract testing
    "pytest-repeated==0.3.9", # For statistical testing of LLM responses (esp. the low parameter SLMs used in tests.)
    "httpx>=0.28.1",          # To make more complex calls, such as streaming.
    "litellm==1.84.0",
    "requests",
    "redis>=5.0.0",           # For Redis connection in test fixtures
]

dev = [
    "ruff>=0.12.11",          # For linting
    "black>=24.0.0",          # For code formatting (Black)
    "isort>=5.0.0",           # For moving and sorting imports
    "docformatter>=1.7.5",    # For formatting docstrings
]

docs = [
    "mkdocs-material>=9.0.0",        # Material theme for MkDocs
    "mkdocstrings[python]>=0.24.0",  # API documentation from docstrings
    "mike>=2.0",                     # Versioned docs deployment to GitHub Pages
]

[tool.isort]
profile = "black"

[tool.ruff]
line-length = 80

[tool.ruff.lint]
select = ["I", "F", "E", "W"]
ignore = ["E501"]

[tool.black]
line-length = 80
target-version = ['py312']

[tool.docformatter]
wrap-summaries = 79
wrap-descriptions = 79
in-place = true
recursive = true

[project.urls]
Homepage = "https://github.com/sinan-ozel/<MODULE-NAME>"
Issues = "https://github.com/sinan-ozel/<MODULE-NAME>/issues"
