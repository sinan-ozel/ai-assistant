services:
  # Test infrastructure services
  redis-test:
    image: redis:7.4.2-alpine
    container_name: redis-test-no-mcp
    command: redis-server
    networks:
      - test-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  qdrant-test:
    image: qdrant/qdrant:v1.12.1
    container_name: qdrant-test-no-mcp
    networks:
      - test-network
    healthcheck:
      test: ["CMD-SHELL", "timeout 10s bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5

  ollama-test:
    image: sinanozel/ollama.0.12.11:gemma3-270m
    container_name: ollama-test-no-mcp
    networks:
      - test-network
    deploy:
      resources:
        reservations:
          memory: 1G
    healthcheck:
      test: ["CMD-SHELL", "timeout 10s bash -c ':> /dev/tcp/127.0.0.1/11434' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Application under test — no eberron-mcp-server in this environment
  app:
    build:
      context: ../..
      dockerfile: agent_stem/Dockerfile
    container_name: app-test-no-mcp
    networks:
      - test-network
    environment:
      - REDIS_HOST=redis-test
      - REDIS_PORT=6379
      - QDRANT_HOST=qdrant-test
      - QDRANT_PORT=6333
    env_file:
      - .env
    depends_on:
      redis-test:
        condition: service_healthy
      qdrant-test:
        condition: service_healthy
      ollama-test:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import json,urllib.request,sys; \
          r=urllib.request.urlopen('http://localhost:8000/health',timeout=2); \
          d=json.load(r); \
          sys.exit(0 if not d.get('providers_loading') else 1)"
        ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 60s
    volumes:
      - ${AGENT_FOLDER:-./cortex}:/app/cortex

  tests:
    build:
      context: ../..
      dockerfile: test_environments/Dockerfile
    container_name: tests-runner-no-mcp
    networks:
      - test-network
    environment:
      - BASE_URL=http://app:8000
      - REDIS_HOST=redis-test
      - REDIS_PORT=6379
    depends_on:
      redis-test:
        condition: service_healthy
      app:
        condition: service_healthy
    volumes:
      - ${TEST_FOLDER:-.}:/tests
    command: ["pytest", "--mcp-tools=http://app:8001", "-v"]

networks:
  test-network:
    driver: bridge
