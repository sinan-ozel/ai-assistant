services:
  # Test infrastructure services
  # Application under test
  app:
    build:
      context: ../..
      dockerfile: agent_stem/Dockerfile
    container_name: app-test-nothing
    networks:
      - test-network
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/health | grep -q '\"providers_loading\":false' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 60s

  # Test runner
  tests:
    build:
      context: ../..
      dockerfile: test_environments/Dockerfile
    container_name: tests-runner-nothing
    networks:
      - test-network
    environment:
      - BASE_URL=http://app:8000
    depends_on:
      app:
        condition: service_healthy
    volumes:
      - .:/tests
      - test-results:/tests/test-results

networks:
  test-network:
    driver: bridge

volumes:
  test-results: