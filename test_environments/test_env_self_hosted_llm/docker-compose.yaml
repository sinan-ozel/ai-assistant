services:
  # Test infrastructure services
  redis-test:
    image: redis:7.4.2-alpine
    container_name: redis-test-self-hosted-llm
    command: redis-server
    network_mode: "host"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  qdrant-test:
    image: qdrant/qdrant:v1.12.1
    container_name: qdrant-test-self-hosted-llm
    network_mode: "host"
    healthcheck:
      test: ["CMD-SHELL", "timeout 10s bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
    ports:
      - "6333:6333"

  # Application under test
  app:
    build:
      context: ../..
      dockerfile: agent_stem/Dockerfile
    container_name: app-test-self-hosted-llm
    network_mode: "host"
    environment:
      - REDIS_HOST=localhost
      - REDIS_PORT=6379
      - QDRANT_HOST=localhost
      - QDRANT_PORT=6333
      - EMBEDDING_HOST=localhost. # TODO: Change this, that port is busy with a real model.
      - EMBEDDING_PORT=11434
      - CONVERSATION_WINDOW_LIMIT=4096
    depends_on:
      redis-test:
        condition: service_healthy
      qdrant-test:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import json,urllib.request,sys; \
          r=urllib.request.urlopen('http://localhost:8000/health',timeout=2); \
          d=json.load(r); \
          sys.exit(0)"
        ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 60s
    volumes:
      - ${CORTEX_FOLDER:-./cortex}:/app/cortex

  # Test runner
  tests:
    build:
      context: ../..
      dockerfile: test_environments/Dockerfile
    container_name: tests-runner-self-hosted-llm
    network_mode: "host"
    env_file:
      - .env
    environment:
      - BASE_URL=http://localhost:8000
      - OLLAMA_HOST
      - REDIS_HOST=localhost
      - QDRANT_HOST=localhost
    depends_on:
      app:
        condition: service_healthy
    volumes:
      - ${TEST_FOLDER:-.}:/tests
      - ${CORTEX_FOLDER:-./cortex}:/app/cortex
    command: ["pytest", "--openapi=http://localhost:8000", "--openapi-no-strict-example-checking", "--openapi-markdown-output=report.md", "--openapi-no-stdout", "--openapi-timeout=150", "-vv", "--maxfail=1"]

networks:
  test-network:
    driver: bridge
