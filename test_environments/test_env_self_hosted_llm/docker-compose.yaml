services:
  # Test infrastructure services
  redis-test:
    image: redis:7.4.2-alpine
    container_name: redis-test-self-hosted-llm
    command: redis-server --appendonly yes
    network_mode: "host"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  qdrant-test:
    image: qdrant/qdrant:v1.12.1
    container_name: qdrant-test-self-hosted-llm
    network_mode: "host"
    healthcheck:
      test: ["CMD-SHELL", "timeout 10s bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Application under test
  app:
    build:
      context: ../..
      dockerfile: agent_stem/Dockerfile
    container_name: app-test-self-hosted-llm
    network_mode: "host"
    environment:
      - REDIS_HOST=localhost
      - REDIS_PORT=6379
      - QDRANT_HOST=localhost
      - QDRANT_PORT=6333
      - EMBEDDING_HOST=localhost
      - EMBEDDING_PORT=11434
    depends_on:
      redis-test:
        condition: service_healthy
      qdrant-test:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/health"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 60s
    volumes:
      - ${AGENT_FOLDER:-./cortex}:/app/cortex

  # Test runner
  tests:
    build:
      context: ../..
      dockerfile: test_environments/Dockerfile
    container_name: tests-runner-self-hosted-llm
    network_mode: "host"
    env_file:
      - .env
    environment:
      - BASE_URL=http://localhost:8000
      - OLLAMA_HOST
    depends_on:
      app:
        condition: service_healthy
    volumes:
      - ${TEST_FOLDER:-.}:/tests
    command: ["pytest", "--openapi=http://localhost:8000", "--openapi-no-strict-example-checking", "--openapi-markdown-output=report.md", "--openapi-no-stdout", "--openapi-timeout=60", "-v"]

networks:
  test-network:
    driver: bridge
