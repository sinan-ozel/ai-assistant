services:
  # Test infrastructure services
  qdrant-test:
    image: qdrant/qdrant:v1.12.1
    container_name: qdrant-test-no-redis
    networks:
      - test-network
    healthcheck:
      test: ["CMD-SHELL", "timeout 10s bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
        reservations:
          cpus: "0.10"
          memory: 256M
  # Application under test
  app:
    build:
      context: ../..
      dockerfile: agent_stem/Dockerfile
    container_name: app-test-no-redis
    # network_mode: "host"
    environment:
      - QDRANT_HOST=qdrant-test
      - QDRANT_PORT=6333
      - CONVERSATION_WINDOW_LIMIT=2048
      # Short grace period so library reconciliation tests finish quickly.
      - LIBRARY_RECONCILIATION_GRACE_SECONDS=15
      # - LOG_LEVEL=DEBUG
      - OLLAMA_HOST
      - LLAMA_CPP_HOST
    env_file:
      - .env
    depends_on:
      qdrant-test:
        condition: service_healthy
    networks:
      - test-network
    healthcheck:
      test: ["CMD", "python", "-c", "import json,urllib.request,sys; r=urllib.request.urlopen('http://localhost:8000/health',timeout=2); d=json.load(r); sys.exit(0)"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 60s
    volumes:
      - ${AGENT_FOLDER:-./cortex}:/app/cortex
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 2500M
        reservations:
          cpus: "0.25"
          memory: 1G
  # Test runner
  tests:
    build:
      context: ../..
      dockerfile: test_environments/Dockerfile
    container_name: tests-runner-no-redis
    environment:
      - BASE_URL=http://app:8000
      - OLLAMA_HOST
      - LLAMA_CPP_HOST
    env_file:
      - .env
    depends_on:
      app:
        condition: service_healthy
    networks:
      - test-network
    volumes:
      - ${TEST_FOLDER:-.}:/tests
      - ${AGENT_FOLDER:-./cortex}:/app/cortex
    command: ["pytest", "--openapi=http://app:8000", "--openapi-no-strict-example-checking", "--openapi-markdown-output=report.md", "--openapi-no-stdout", "--openapi-timeout=315", "-vv", "--maxfail=1"]
networks:
  test-network:
    driver: bridge
