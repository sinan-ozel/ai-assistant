services:
  # Test infrastructure services
  redis-test:
    image: redis:7.4.2-alpine
    container_name: redis-test-no-qdrant
    command: redis-server
    networks:
      - test-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  embedding-test:
    image: sinanozel/ollama.0.12.11:all-minilm-33m
    container_name: embedding-test-no-qdrant
    networks:
      - test-network
    environment:
      - OLLAMA_KEEP_ALIVE=1h
    healthcheck:
      test:
        - "CMD"
        - "bash"
        - "-c"
        - >-
          exec 3<>/dev/tcp/127.0.0.1/11434 &&
          printf 'GET /api/tags HTTP/1.0\r\nHost: localhost\r\n\r\n' >&3 &&
          timeout 5 cat <&3 | grep -q all-minilm
      interval: 10s
      timeout: 8s
      retries: 10
      start_period: 60s

  # Cleans up generated .md files and Redis pipeline state before the app
  # starts so the PDF pipeline always begins from a known-clean state and
  # the chunking pipeline never processes stale files from a previous run.
  init:
    image: redis:7.4.2-alpine
    container_name: init-no-qdrant
    networks:
      - test-network
    depends_on:
      redis-test:
        condition: service_healthy
    volumes:
      - ${AGENT_FOLDER:-./cortex}:/app/cortex
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/init_done"]
      interval: 2s
      timeout: 1s
      retries: 30
    command:
      - sh
      - -c
      - |
          find /app/cortex/library -name '*.md' 2>/dev/null | grep -v '/\.' |
          while IFS= read -r f; do
            pdf=$$(echo "$$f" | sed 's/\.md$$/\.pdf/');
            [ -f "$$pdf" ] && rm "$$f";
          done;
          redis-cli -h redis-test DEL memory:pdf_pipeline_state memory:chunking_pipeline_state memory:library;
          touch /tmp/init_done;
          tail -f /dev/null

  # Application under test
  app:
    build:
      context: ../..
      dockerfile: agent_stem/Dockerfile
    container_name: app-test-no-qdrant
    networks:
      - test-network
    environment:
      - REDIS_HOST=redis-test
      - REDIS_PORT=6379
      - EMBEDDING_SERVER=http://embedding-test:11434
      - EMBEDDING_TIMEOUT=10.0
    env_file:
      - .env
    depends_on:
      init:
        condition: service_healthy
      redis-test:
        condition: service_healthy
      embedding-test:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import json,urllib.request,sys; \
          r=urllib.request.urlopen('http://localhost:8000/health',timeout=2); \
          d=json.load(r); \
          sys.exit(0 if not d.get('providers_loading') else 1)"
        ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 60s
    volumes:
      - ${AGENT_FOLDER:-./cortex}:/app/cortex

  # Test runner
  tests:
    build:
      context: ../..
      dockerfile: test_environments/Dockerfile
    container_name: tests-runner-no-qdrant
    networks:
      - test-network
    environment:
      - BASE_URL=http://app:8000
      - REDIS_HOST=redis-test
      - REDIS_PORT=6379
    depends_on:
      redis-test:
        condition: service_healthy
      app:
        condition: service_healthy
    volumes:
      - ${TEST_FOLDER:-.}:/tests
      - ${AGENT_FOLDER:-./cortex}:/app/cortex
    command: ["pytest", "-v"]

networks:
  test-network:
    driver: bridge
