{{- if .Values.llamacpp.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ai-assistant.fullname" . }}-llamacpp
  labels:
    {{- include "ai-assistant.labels" . | nindent 4 }}
    app.kubernetes.io/component: llamacpp
spec:
  replicas: {{ .Values.llamacpp.replicaCount }}
  selector:
    matchLabels:
      {{- include "ai-assistant.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: llamacpp
  template:
    metadata:
      labels:
        {{- include "ai-assistant.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: llamacpp
    spec:
      {{- if .Values.llamacpp.nodeSelector }}
      nodeSelector:
        {{- toYaml .Values.llamacpp.nodeSelector | nindent 8 }}
      {{- end }}
      {{- if .Values.llamacpp.tolerations }}
      tolerations:
        {{- toYaml .Values.llamacpp.tolerations | nindent 8 }}
      {{- end }}
      containers:
        - name: llamacpp
          image: "{{ .Values.llamacpp.image.repository }}:{{ .Values.llamacpp.image.tag }}"
          imagePullPolicy: IfNotPresent
          {{- if .Values.llamacpp.args }}
          args:
            {{- toYaml .Values.llamacpp.args | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 20
          {{- if .Values.llamacpp.resources }}
          resources:
            {{- toYaml .Values.llamacpp.resources | nindent 12 }}
          {{- end }}
{{- end }}
