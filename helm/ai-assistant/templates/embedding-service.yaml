{{- if .Values.embedding.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "ai-assistant.fullname" . }}-embedding
  labels:
    {{- include "ai-assistant.labels" . | nindent 4 }}
    app.kubernetes.io/component: embedding
spec:
  type: ClusterIP
  selector:
    {{- include "ai-assistant.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: embedding
  ports:
    - name: embed
      port: {{ .Values.embedding.port }}
      targetPort: embed
      protocol: TCP
{{- end }}
