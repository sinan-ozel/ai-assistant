{{- if or .Values.secrets.mistralApiKey .Values.secrets.anthropicApiKey }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ai-assistant.fullname" . }}-api-keys
  labels:
    {{- include "ai-assistant.labels" . | nindent 4 }}
type: Opaque
data:
  {{- if .Values.secrets.mistralApiKey }}
  MISTRAL_API_KEY: {{ .Values.secrets.mistralApiKey | b64enc | quote }}
  {{- end }}
  {{- if .Values.secrets.anthropicApiKey }}
  ANTHROPIC_API_KEY: {{ .Values.secrets.anthropicApiKey | b64enc | quote }}
  {{- end }}
{{- end }}
