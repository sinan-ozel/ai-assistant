apiVersion: v1
kind: Service
metadata:
  name: {{ include "ai-assistant.fullname" . }}
  labels:
    {{- include "ai-assistant.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "ai-assistant.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: app
  ports:
    - name: http
      port: 8000
      targetPort: http
      protocol: TCP
    - name: streamlit
      port: 8501
      targetPort: streamlit
      protocol: TCP
