{{- range .Values.mcpServers }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "ai-assistant.fullname" $ }}-{{ .name }}
  labels:
    {{- include "ai-assistant.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ .name }}
spec:
  type: ClusterIP
  selector:
    {{- include "ai-assistant.selectorLabels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ .name }}
  ports:
    - name: http
      port: {{ .port | default $.Values.mcp.defaultPort }}
      targetPort: http
      protocol: TCP
{{- end }}
