apiVersion: v1
kind: Service
metadata:
  name: {{ include "ai-assistant.fullname" . }}-qdrant
  labels:
    {{- include "ai-assistant.labels" . | nindent 4 }}
    app.kubernetes.io/component: qdrant
spec:
  type: ClusterIP
  selector:
    {{- include "ai-assistant.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: qdrant
  ports:
    - name: http
      port: 6333
      targetPort: http
      protocol: TCP
    - name: grpc
      port: 6334
      targetPort: grpc
      protocol: TCP
