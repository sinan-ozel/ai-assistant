name: book_metadata_extraction
path: /v1/extract-book-metadata
description: Takes an image of a book cover and extracts the book metadata as JSON.
# provider: vision

input_requirements:
  content_types: [image]
  description: Requires one image of a book cover

output_schema:
  type: object
  properties:
    title:
      type: string
      description: The title of the book.
    author:
      type: string
      description: The author of the book.
    subtitle:
      type: string
      description: The subtitle of the book.
    publisher:
      type: string
      description: The publisher of the book.
    series_title:
      type: string
      description: The title of the series the book belongs to.
    series_number:
      type: integer
      description: The number of the book in the series.
  required: [title, author]

execution:
  type: prompt
  prompt: |
    The image is a book cover.
    It likely includes the title, the author and perhaps a subtitle, publisher information, series and perhaps even a promotioal sticker.
    Extract the book metadata and return it as a JSON object with the following fields: title, author, subtitle, publisher, series_title, series_number.
