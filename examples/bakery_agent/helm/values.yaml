# Helm values for the bakery_agent example.
#
# Prerequisites:
#   kubectl create secret generic llm-secrets --from-literal=MISTRAL_API_KEY=sk-...
#
# Deploy:
#   helm upgrade --install bakery ./helm/ai-assistant \
#     -f examples/bakery_agent/helm/values.yaml \
#     --wait
#
# Forward ports:
#   kubectl port-forward svc/bakery-ai-assistant 8000:8000

replicaCount: 1

env:
  embeddingTimeout: "8.0"

extraEnvFromSecret: llm-secrets

mcpServers:
  - name: business-hours
    image: sinanozel/business-hours-mcp:0.1.0
    port: 8000
    env:
      TIMEZONE: America/New_York
      HOURS_MON: closed
      HOURS_TUE: "08:00-18:00"
      HOURS_WED: "08:00-18:00"
      HOURS_THU: "08:00-18:00"
      HOURS_FRI: "08:00-18:00"
      HOURS_SAT: "08:00-18:00"
      HOURS_SUN: "08:00-18:00"
