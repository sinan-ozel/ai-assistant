name: book_title_extraction
path: /v1/extract-book-title
description: Takes an image of a book cover and extracts the book title as a string.
provider: llama_on_tailscale
timeout: 240

input_requirements:
  content_types: [image]
  description: Requires one image of a book cover

output_schema:
  type: string

execution:
  type: prompt
  prompt: |
    The image is a book cover.
    It likely includes the title, the author and perhaps a subtitle, publisher information, series and perhaps even a promotioal sticker.
    Print the title of the book only, without any additional text.
    Only the title, nothing else.
