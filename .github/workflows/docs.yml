name: Deploy Documentation

on:
  push:
    # Trigger on semver tags created by release/release.sh (e.g. v1.2.3).
    # Pattern matches the git tag format used by the Release VS Code task.
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: write   # required to push to gh-pages

    steps:
      - name: Checkout (full history required by mike)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install docs dependencies
        run: pip install .[docs]

      - name: Configure git identity for mike
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Extract version from tag
        id: ver
        # GITHUB_REF_NAME is "v1.2.3" — strip the leading 'v' for mike
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Deploy versioned docs with mike
        run: |
          mike deploy --push --update-aliases "${{ steps.ver.outputs.VERSION }}" latest

      - name: Set latest as the default redirect
        run: |
          mike set-default --push latest
