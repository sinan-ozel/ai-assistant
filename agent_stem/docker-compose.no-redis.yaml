services:
  qdrant:
    image: qdrant/qdrant:v1.12.1
    container_name: qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ${DEV_DATA_FOLDER:-./dev-data}/qdrant:/qdrant/storage
    networks:
      - agent-dev-network
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
        reservations:
          cpus: "0.10"
          memory: 256M
  llamacpp:
    image: sinanozel/llama.cuda:qwen3-0.6b
    networks:
      - agent-dev-network
    # command: ["-m", "/models/model.gguf", "--host", "0.0.0.0", "--port", "8080", "-ngl", "999", "-c", "4096", "--no-jinja"]
    deploy:
      resources:
        reservations:
          memory: 1G
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 120s
  ollama:
    image: sinanozel/ollama.0.12.11:gemma3-270m
    container_name: ollama
    networks:
      - agent-dev-network
    deploy:
      resources:
        reservations:
          memory: 1G
    healthcheck:
      test: ["CMD-SHELL", "timeout 10s bash -c ':> /dev/tcp/127.0.0.1/11434' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
  agent-stem-dev:
    build:
      context: ..
      dockerfile: agent_stem/Dockerfile
    container_name: agent-stem-dev
    volumes:
      - ..:/workspace
      - ${AGENT_FOLDER:-./cortex}:/app/cortex
    working_dir: /workspace
    ports:
      - "8000:8000"
      - "8501:8501"
      - "11434:11434"
    # environment:
    #   - CONVERSATION_WINDOW_LIMIT=4096
    #   - LOG_LEVEL=DEBUG
    networks:
      - agent-dev-network
    depends_on:
      - qdrant
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 2500M
        reservations:
          cpus: "0.25"
          memory: 1G
networks:
  agent-dev-network:
    driver: bridge
